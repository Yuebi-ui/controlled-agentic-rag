name: offline-contract-and-evaluation-tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Audit the public checkout before writing local evaluation outputs
        run: |
          python scripts/audit_public_repository.py --export
      - name: Unit, integrity, and offline mock tests
        run: python -m pytest -q
      - name: Ensure published-run audit also works under python -O
        run: python -O eval/results/audit_published_run.py --root docs/experiments/published_runs/RUN-EXAMPLE-2026-001
      - name: Synthetic evaluation metric gate
        run: python eval/run_all.py
      - name: Synthetic Pipeline metadata trace smoke
        run: >-
          python scripts/collect_eval_traces.py --mode synthetic
          --cases eval/data/pipeline_cases_synthetic.jsonl
          --output outputs/eval_trace
      - name: Synthetic Agent workflow benchmark
        run: >-
          python eval/agent_workflow/run.py --mode synthetic
          --cases eval/data/agent_workflow_synthetic.jsonl
          --output outputs/workflow_synthetic
      - name: Paired Round2 ablation smoke
        run: >-
          python eval/ablation/run_matrix.py --mode synthetic
          --cases eval/data/agent_workflow_synthetic.jsonl
          --matrix eval/data/ablation_matrix_synthetic.json
          --output outputs/ablation_synthetic
      - name: Synthetic deterministic guard probes
        run: python eval/safety/run_control_probes.py --output outputs/safety_probes.jsonl
      - name: Evaluate deterministic guard probe traces
        run: >-
          python -m controlled_rag.evaluation --suite safety
          --input outputs/safety_probes.jsonl
          --output outputs/safety_probes_report.json
      - name: Audit shipped scenario bundle
        run: python eval/results/audit_published_run.py --root docs/experiments/published_runs/RUN-EXAMPLE-2026-001
      - name: Upload offline diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-eval-${{ matrix.python-version }}
          path: |
            eval/reports/synthetic-run/
            outputs/eval_trace/
            outputs/workflow_synthetic/
            outputs/ablation_synthetic/
            outputs/safety_probes_report.json
          if-no-files-found: ignore

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install packages for dependency audit
        run: python -m pip install -e '.[test]' pip-audit
      - name: Audit installed dependency tree
        run: python -m pip_audit
