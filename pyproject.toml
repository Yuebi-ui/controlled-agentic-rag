[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-agentic-rag"
version = "0.1.0"
description = "Fail-closed, two-round, parent-aware RAG orchestration reference implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
models = ["openai>=1.0", "torch>=2.5", "transformers>=4.50", "python-dotenv>=1.0"]
retrieval = ["pymongo>=4.6", "pymilvus>=2.5", "jieba>=0.42"]
benchmark = ["locust>=2.20", "httpx>=0.27"]
train = ["scikit-learn>=1.4", "numpy>=1.26"]
test = ["pytest>=8.0", "fastapi>=0.115", "httpx>=0.27", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["controlled_rag*", "controlled_answer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
