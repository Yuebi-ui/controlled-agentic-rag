[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-agentic-rag"
version = "0.1.0"
description = "Fail-closed, two-round, parent-aware RAG orchestration reference implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
models = ["openai>=1.0,<3", "torch>=2.5,<3", "transformers>=4.50,<6", "python-dotenv>=1.0,<2"]
retrieval = ["pymongo>=4.6,<5", "pymilvus>=2.5,<4", "jieba>=0.42,<1"]
benchmark = ["locust>=2.20,<3", "httpx>=0.27,<1"]
train = ["scikit-learn>=1.4,<2", "numpy>=1.26,<3"]
test = ["pytest>=8.0,<10", "fastapi>=0.115,<1", "httpx>=0.27,<1", "python-dotenv>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["controlled_rag*", "controlled_answer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
